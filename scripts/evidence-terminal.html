<!doctype html>
<html lang="es">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>PowerShell | Terminal real de evidencias</title><link rel="stylesheet" href="/xterm.css">
<style>
*{box-sizing:border-box}body{margin:0;background:#171b20;color:#dbe2ea;font-family:Segoe UI,Arial,sans-serif}header{height:48px;background:#222831;display:flex;align-items:center;justify-content:space-between;padding:0 22px;border-bottom:1px solid #414955;font-size:13px}header strong{font-weight:500}.engine{font:11px Consolas,monospace;color:#a0afbe}.toolbar{display:flex;align-items:center;gap:12px;padding:12px 22px;background:#1c222a;font-size:12px;border-bottom:1px solid #343c47}label{color:#adbac8}select,button{background:#293441;color:#e4edf5;border:1px solid #526171;border-radius:3px;padding:8px 12px;font:12px Segoe UI,sans-serif}button{cursor:pointer}button:disabled{opacity:.45}select:focus-visible,button:focus-visible{outline:2px solid #a6c774;outline-offset:3px}#status{margin-left:auto;color:#b5ca91;font:11px Consolas,monospace}#terminal{height:calc(100dvh - 136px);min-height:560px;padding:18px 22px;background:#11161c}footer{padding:7px 22px;font:11px Consolas,monospace;color:#8d9dae;border-top:1px solid #313a44}.xterm-viewport{scrollbar-color:#556576 #11161c}
</style></head>
<body><header><strong>Windows PowerShell</strong><span class="engine">Proceso real local / salida stdout y stderr</span></header><div class="toolbar"><label for="file">Archivo</label><select id="file"><option value="if">IfView.vue</option><option value="show">ShowView.vue</option><option value="for">ForView.vue</option><option value="key">KeyView.vue</option><option value="router">router/index.js</option><option value="nav">App.vue / navegación</option><option value="build">deploy.yml</option><option value="config">package.json</option><option value="spa">navigation.test.js</option><option value="motion">HeroDiagram.vue</option></select><label for="part">Fragmento</label><select id="part"><option value="template">Plantilla</option><option value="next">Plantilla (continuación)</option><option value="state">Estado y lógica</option></select><button id="run" disabled>Ejecutar Get-Content</button><span id="status" role="status">Conectando con PowerShell…</span></div><div id="terminal"></div><footer>Captura de terminal en navegador. Los comandos se ejecutan en Windows; no es una imagen simulada de código.</footer>
<script src="/xterm.js"></script><script src="/fit.js"></script><script>
const term=new Terminal({fontFamily:'Consolas,monospace',fontSize:15,lineHeight:1.1,convertEol:true,scrollback:2000,disableStdin:true,cursorBlink:false,theme:{background:'#11161c',foreground:'#e1e8f0',cursor:'#b8cd8f'}});
const fit=new FitAddon.FitAddon();term.loadAddon(fit);term.open(document.getElementById('terminal'));fit.fit();window.addEventListener('resize',()=>fit.fit());
const socket=new WebSocket('ws://127.0.0.1:4182');const run=document.getElementById('run');const status=document.getElementById('status');
socket.onopen=()=>{run.disabled=false;status.textContent='Conectado · PowerShell disponible';};
run.addEventListener('click',()=>{term.reset();run.disabled=true;status.textContent='Ejecutando proceso PowerShell…';socket.send(JSON.stringify({file:document.getElementById('file').value,part:document.getElementById('part').value}));});
socket.onmessage=event=>{const data=JSON.parse(event.data);if(data.type==='start'){term.writeln('Windows PowerShell  |  '+data.path);term.writeln('PS> '+data.command);term.writeln('');}if(data.type==='stdout')term.write(data.text);if(data.type==='stderr')term.write('\x1b[31m'+data.text+'\x1b[0m');if(data.type==='end'){term.write('\r\nPS>',()=>requestAnimationFrame(()=>requestAnimationFrame(()=>{term.scrollToTop();status.textContent='Proceso finalizado · código de salida '+data.code;run.disabled=false;document.body.dataset.exitCode=String(data.code);})));}};
socket.onclose=()=>{run.disabled=true;status.textContent='Proceso desconectado';};
</script></body></html>
